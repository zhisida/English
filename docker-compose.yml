# 依依老师课堂 · 一键部署
#   docker compose up -d --build
#   前台: http://localhost:3000   管理后台: http://localhost:3000/manage
services:
  yiyi-classroom:
    build: .
    image: yiyi-classroom:latest
    container_name: yiyi-classroom
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # 运行时配置（含 API Key）持久化；首次部署可把 data/config.example.json
      # 复制为 data/config.json 并填入 apiKey。
      - ./data:/app/data
    environment:
      NODE_ENV: production
      ADMIN_USER: admin
      # 管理后台密码：设置后用它登录；不设则首次启动自动生成（见 `docker logs yiyi-classroom`）。
      # ADMIN_PASS: "change-me"
      # 也可用环境变量覆盖模型配置（优先级高于 data/config.json）：
      # API_BASE: "http://hb.wwszxc.tax:19061/v1"
      # API_KEY: "sk-..."
      # APP_TITLE: "依依老师课堂"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
